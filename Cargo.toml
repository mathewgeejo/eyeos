[package]
name = "eyeos"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline, safety-first Windows desktop eye-control prototype"
license = "MIT OR Apache-2.0"

[features]
default = ["camera"]
camera = ["dep:nokhwa"]
onnx = ["dep:ort"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
libloading = "0.8"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf", "decoding"], optional = true }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
