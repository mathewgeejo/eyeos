[package]
name = "eyeos"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline, safety-first Windows desktop eye-control prototype"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/eye-tracker-core"]
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "eyeos"
path = "src/main.rs"
required-features = ["desktop", "camera"]

[features]
default = ["desktop", "camera"]
desktop = ["dep:clap", "dep:directories", "dep:eframe", "dep:egui"]
native = ["dep:libloading", "dep:openvino", "dep:openvino-sys", "dep:sha2"]
camera = ["native", "dep:nokhwa"]
onnx = ["dep:ort"]

[dependencies]
anyhow = "1.0"
eye-tracker-core = { path = "crates/eye-tracker-core" }
clap = { version = "4.5", features = ["derive"], optional = true }
directories = { version = "6.0", optional = true }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.31", optional = true }
libloading = { version = "0.8", optional = true }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf", "decoding"], optional = true }
openvino = { version = "0.11", features = ["runtime-linking"], optional = true }
openvino-sys = { version = "0.11", features = ["runtime-linking"], optional = true }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
thiserror = "2.0"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
